services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brewrecipe
      POSTGRES_USER: brew
      POSTGRES_PASSWORD: brew
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brew -d brewrecipe"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: brew_api/Dockerfile
    command: >
      sh -c "python brew_api/manage.py migrate &&
             python brew_api/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: brewrecipe
      POSTGRES_USER: matheus
      POSTGRES_PASSWORD: 123456
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: